<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
    <!-- ⭐ 引入 Cesium 核心库（来自 update-gis 打包的静态资源） -->
    <script src="/gis/Cesium/Cesium.js"></script>
    <!-- ⭐ 引入 Cesium Widgets 样式 -->
    <link href="/gis/Cesium/Widgets/widgets.css" rel="stylesheet">
    <!-- ⭐ 引入 vue3-sfc-loader（用于动态加载 .mjs 组件） -->
    <script src="/gis/libs/vue3-sfc-loader.js"></script>
    <!-- ⭐ Import Map 配置（用于 load-three-globals.js 解析模块路径） -->
    <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
    </script>
    <!-- ⭐ 引入 Three.js 全局加载脚本（将 THREE 加载到 window 对象） -->
    <script type="module" src="/gis/load-three-globals.js"></script>
    <!-- ⭐ 引入 SGKJ_SDK 依赖 -->
    <script src="/dist/commons-3.0.1.min.js"></script>
    <script src="/dist/main-3.0.1.min.js"></script>
    <script src="/dist/ui-3.0.1.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
